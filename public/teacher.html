<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Teacher dashboard · EDUCADE</title>
  <meta name="description" content="Explore EDUCADE’s interactive teacher dashboard with Grade 5 language arts skills, student profiles and learning evidence.">
  <meta name="theme-color" content="#102844">
  <link rel="icon" href="assets/favicon.png">
  <link rel="stylesheet" href="teacher.css">
</head>
<body>
  <a class="skip-link" href="#workspace">Skip to dashboard</a>
  <aside class="sidebar" aria-label="Dashboard navigation">
    <a class="brand" href="index.html" aria-label="EDUCADE home" title="Go to EDUCADE"><img src="assets/logo.png" alt="EDUCADE" width="1633" height="358"></a>
    <div class="sidebar-label">THE TEACHER’S VIEW</div>
    <nav class="sidebar-nav" aria-label="Your classes">
      <button id="nav-class" class="nav-item classes-toggle" type="button" aria-expanded="true" aria-controls="sidebar-classes"><span aria-hidden="true">▦</span> Classes <svg class="nav-chevron" viewBox="0 0 16 16" aria-hidden="true"><path d="m4 6 4 4 4-4"/></svg></button>
      <div id="sidebar-classes" class="sidebar-classes">
        <div id="sidebar-class-list" class="sidebar-class-list"></div>
        <div class="class-management">
          <button type="button" data-class-action="import"><span aria-hidden="true">↓</span> Import class</button>
          <button type="button" data-class-action="create"><span aria-hidden="true">＋</span> Create new class</button>
        </div>
      </div>
    </nav>
    <div class="sidebar-note"><span class="tiny-star" aria-hidden="true">✦</span><strong>A quest for them.<br>A clearer picture for you.</strong><p>Explore the learning behind each adventure.</p></div>
    <div class="sidebar-scene" aria-hidden="true"><span></span></div>
    <a class="home-link" href="index.html" title="Go to EDUCADE">← Back to EDUCADE</a>
  </aside>
  <main id="workspace" tabindex="-1">
    <div class="presentation-controls" aria-label="Dashboard controls">
      <label class="field class-picker">Class<select id="class-select" aria-label="Choose class"></select></label>
      <label class="field portrait-picker">Portrait style<select id="portrait-style"><option value="photos">Photos</option><option value="vikings">Viking avatars</option><option value="initials">Initials</option></select></label>
      <div class="dashboard-menu">
        <button id="dashboard-menu-button" class="icon-button menu-button" type="button" aria-label="Dashboard menu" aria-expanded="false" aria-controls="dashboard-menu-options"><span aria-hidden="true"><i></i><i></i><i></i></span></button>
        <div id="dashboard-menu-options" class="menu-options" hidden>
          <button type="button" data-utility="settings">Settings</button>
          <button type="button" data-utility="help">Help</button>
          <button type="button" data-utility="account">My Account</button>
        </div>
      </div>
    </div>
    <div id="dashboard" aria-live="off"></div>
    <footer class="dashboard-footer">EDUCADE teacher dashboard <span>Grade 5 · Viking Quest</span></footer>
  </main>
  <dialog id="evidence-dialog" aria-labelledby="evidence-title"><div class="dialog-top"><span class="evidence-badge">Learning evidence</span><button id="close-evidence" type="button" class="icon-button" aria-label="Close skill evidence">✕</button></div><div id="evidence-content"></div></dialog>
  <dialog id="utility-dialog" aria-labelledby="utility-title"><div class="dialog-top"><h2 id="utility-title"></h2><button id="close-utility" type="button" class="icon-button" aria-label="Close dashboard panel">✕</button></div><div id="utility-content"></div><p id="preference-status" class="preference-status" role="status" hidden></p></dialog>
  <noscript><p class="noscript">Enable JavaScript to explore this interactive dashboard.</p></noscript>
  <script src="teacher-data.js"></script>
  <script src="teacher-portraits.js"></script>
  <script src="teacher.js"></script>
</body>
</html>
